[DLSS]
; 0 = automatic GPU-aware policy. F8 compares DLSS with Unreal TAA/TAAU.
RenderPreset=0

[FrameGeneration]
; F9 toggles AMD FSR Frame Generation. F8 toggles DLSS / DLAA.
; The game's FSR upscaler must remain OFF. FG resumes with DLSS enabled.
Enabled=1

[Sharpening]
Enabled=0
DLAA=0
Quality=0
Balanced=0
Performance=0
UltraPerformance=0

[DepthOfField]
; Native autofocus interpolation uses elapsed time. Restart after editing.
FixFocusTiming=1
; Time constant, seconds. Valid range: 0.05..2.0; default: 0.25.
TimeConstantSeconds=0.25
