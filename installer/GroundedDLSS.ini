[DLSS]
; 0 = automatic GPU-aware policy. F8 compares DLSS with Unreal TAA/TAAU.
RenderPreset=0

[Sharpening]
Enabled=0
DLAA=0
Quality=0
Balanced=0
Performance=0
UltraPerformance=0

[DepthOfField]
; Native autofocus interpolation uses elapsed time. Restart after editing.
FixFocusTiming=1
; Time constant, seconds. Valid range: 0.05..2.0; default: 0.25.
TimeConstantSeconds=0.25
